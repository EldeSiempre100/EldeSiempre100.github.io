name: ATLAS NEWS — Emergency Artifact Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-artifact-request.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-emergency-artifact
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar artefacto Astro validado
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio público
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolver solicitud
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-artifact-request.json
          source_sha="$(jq -r '.source_sha' "$req")"
          base_url="$(jq -r '.artifact_base_url' "$req" | sed 's:/*$::')"
          expected_date="$(jq -r '.date' "$req")"

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_url" =~ ^https:// ]]
          [[ "$expected_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "expected_date=$expected_date" >> "$GITHUB_OUTPUT"

      - name: Descargar y verificar status del build Astro
        id: manifest
        env:
          BASE_URL: ${{ steps.request.outputs.base_url }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EXPECTED_DATE: ${{ steps.request.outputs.expected_date }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/atlas-news-emergency-dist"
          mkdir -p "$stage"
          curl --retry 3 --retry-all-errors -fsSL "$BASE_URL/status.json" -o "$stage/status.json"

          jq -e --arg sha "$SOURCE_SHA" --arg date "$EXPECTED_DATE" '
            .schemaVersion == 1 and
            .sourceCommit == $sha and
            .morningPackage.date == $date and
            .morningPackage.generalPublished == true and
            .morningPackage.nationalPublished == true and
            .morningPackage.marketsPublished == true and
            .morningPackage.completeness == 3
          ' "$stage/status.json" >/dev/null

          general_id="$(jq -r '.latestDaily.id' "$stage/status.json")"
          national_id="$(jq -r '.latestNational.id' "$stage/status.json")"
          markets_id="$(jq -r '.latestMarkets.id' "$stage/status.json")"
          for value in "$general_id" "$national_id" "$markets_id"; do
            [[ -n "$value" && "$value" != "null" ]]
          done

          echo "general_id=$general_id" >> "$GITHUB_OUTPUT"
          echo "national_id=$national_id" >> "$GITHUB_OUTPUT"
          echo "markets_id=$markets_id" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Descargar superficies producidas por Astro
        env:
          BASE_URL: ${{ steps.request.outputs.base_url }}
          STAGE: ${{ steps.manifest.outputs.stage }}
          GENERAL_ID: ${{ steps.manifest.outputs.general_id }}
          NATIONAL_ID: ${{ steps.manifest.outputs.national_id }}
          MARKETS_ID: ${{ steps.manifest.outputs.markets_id }}
        run: |
          set -euo pipefail
          fetch_page() {
            local route="$1"
            local target="$2"
            local fallback
            mkdir -p "$(dirname "$target")"
            echo "fetching=$route"
            if curl --retry 2 --retry-all-errors -fsSL "$BASE_URL$route" -o "$target"; then
              test -s "$target"
              return 0
            fi
            fallback="${route%/}/index.html"
            echo "retrying=$fallback"
            curl --retry 2 --retry-all-errors -fsSL "$BASE_URL$fallback" -o "$target"
            test -s "$target"
          }

          fetch_page "/" "$STAGE/index.html"
          fetch_page "/archivo/" "$STAGE/archivo/index.html"
          fetch_page "/ediciones/" "$STAGE/ediciones/index.html"
          fetch_page "/estado/" "$STAGE/estado/index.html"
          fetch_page "/nacional/" "$STAGE/nacional/index.html"
          fetch_page "/mercados/" "$STAGE/mercados/index.html"
          fetch_page "/ediciones/$GENERAL_ID/" "$STAGE/ediciones/$GENERAL_ID/index.html"
          fetch_page "/nacional/$NATIONAL_ID/" "$STAGE/nacional/$NATIONAL_ID/index.html"
          fetch_page "/mercados/$MARKETS_ID/" "$STAGE/mercados/$MARKETS_ID/index.html"

          # Este JSON no forma parte del gate editorial. Si el build lo expone,
          # se sincroniza; si no, se preserva el último snapshot público válido.
          mkdir -p "$STAGE/data"
          if curl --retry 1 --retry-all-errors -fsSL "$BASE_URL/data/economic-indicators.json" -o "$STAGE/data/economic-indicators.json"; then
            echo "economic_indicators=downloaded"
          else
            rm -f "$STAGE/data/economic-indicators.json"
            echo "economic_indicators=preserved"
          fi

      - name: Sincronizar únicamente superficies afectadas
        env:
          STAGE: ${{ steps.manifest.outputs.stage }}
          GENERAL_ID: ${{ steps.manifest.outputs.general_id }}
          NATIONAL_ID: ${{ steps.manifest.outputs.national_id }}
          MARKETS_ID: ${{ steps.manifest.outputs.markets_id }}
        run: |
          set -euo pipefail
          install -m 644 "$STAGE/index.html" index.html
          install -m 644 "$STAGE/status.json" status.json
          mkdir -p archivo ediciones estado nacional mercados data
          install -m 644 "$STAGE/archivo/index.html" archivo/index.html
          install -m 644 "$STAGE/ediciones/index.html" ediciones/index.html
          install -m 644 "$STAGE/estado/index.html" estado/index.html
          install -m 644 "$STAGE/nacional/index.html" nacional/index.html
          install -m 644 "$STAGE/mercados/index.html" mercados/index.html
          mkdir -p "ediciones/$GENERAL_ID" "nacional/$NATIONAL_ID" "mercados/$MARKETS_ID"
          install -m 644 "$STAGE/ediciones/$GENERAL_ID/index.html" "ediciones/$GENERAL_ID/index.html"
          install -m 644 "$STAGE/nacional/$NATIONAL_ID/index.html" "nacional/$NATIONAL_ID/index.html"
          install -m 644 "$STAGE/mercados/$MARKETS_ID/index.html" "mercados/$MARKETS_ID/index.html"
          if [[ -f "$STAGE/data/economic-indicators.json" ]]; then
            install -m 644 "$STAGE/data/economic-indicators.json" data/economic-indicators.json
          fi

          test -d audio
          test -f data/funds-beagf.json

      - name: Commit y push público de emergencia
        id: publish
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Emergency Runner"
          git config user.email "actions@users.noreply.github.com"
          git add index.html status.json archivo/index.html ediciones/index.html estado/index.html nacional/index.html mercados/index.html
          git add "ediciones/${{ steps.manifest.outputs.general_id }}/index.html"
          git add "nacional/${{ steps.manifest.outputs.national_id }}/index.html"
          git add "mercados/${{ steps.manifest.outputs.markets_id }}/index.html"
          if [[ -f "${{ steps.manifest.outputs.stage }}/data/economic-indicators.json" ]]; then
            git add data/economic-indicators.json
          fi

          if git diff --cached --quiet; then
            echo "La salida pública ya coincide con el artefacto validado."
          else
            git commit -m "EMERGENCY: Publica ATLAS NEWS desde ${SOURCE_SHA}"
            git push origin main
          fi
          echo "public_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verificar repositorio público
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          PUBLIC_COMMIT: ${{ steps.publish.outputs.public_commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$PUBLIC_COMMIT" origin/main
          git show origin/main:status.json | jq -e --arg sha "$SOURCE_SHA" '.sourceCommit == $sha' >/dev/null

      - name: Verificar GitHub Pages
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          GENERAL_ID: ${{ steps.manifest.outputs.general_id }}
          NATIONAL_ID: ${{ steps.manifest.outputs.national_id }}
          MARKETS_ID: ${{ steps.manifest.outputs.markets_id }}
        run: |
          set -euo pipefail
          base="https://eldesiempre100.github.io"
          ok=false
          for attempt in $(seq 1 18); do
            if curl -fsSL "$base/status.json" | jq -e --arg sha "$SOURCE_SHA" '.sourceCommit == $sha' >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 10
          done
          [[ "$ok" == "true" ]]
          curl -fsSL "$base/" >/dev/null
          curl -fsSL "$base/ediciones/$GENERAL_ID/" >/dev/null
          curl -fsSL "$base/nacional/$NATIONAL_ID/" >/dev/null
          curl -fsSL "$base/mercados/$MARKETS_ID/" >/dev/null
          echo "EMERGENCY_WEB_SUCCESS source_sha=$SOURCE_SHA"
