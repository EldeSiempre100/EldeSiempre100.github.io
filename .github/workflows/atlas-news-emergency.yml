name: ATLAS NEWS — Emergency Runner

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-request.json"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "SHA exacto de EldeSiempre100/ATLAS_NEWS"
        required: true
        type: string
      mode:
        description: "validate o deploy_audio"
        required: true
        type: choice
        options:
          - validate
          - deploy_audio

permissions:
  contents: write

concurrency:
  group: atlas-news-emergency
  cancel-in-progress: false

jobs:
  emergency:
    name: Validar / publicar ATLAS NEWS sin Actions privadas
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repositorio público
        uses: actions/checkout@v5
        with:
          path: public
          fetch-depth: 1

      - name: Resolver solicitud
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.source_sha || '' }}
          INPUT_MODE: ${{ inputs.mode || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            source_sha="$INPUT_SHA"
            mode="$INPUT_MODE"
          else
            source_sha="$(jq -r '.source_sha' public/.github/atlas-news-emergency-request.json)"
            mode="$(jq -r '.mode' public/.github/atlas-news-emergency-request.json)"
          fi

          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha inválido: $source_sha" >&2
            exit 1
          fi
          if [[ "$mode" != "validate" && "$mode" != "deploy_audio" ]]; then
            echo "mode inválido: $mode" >&2
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ATLAS_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Verificar credencial de recuperación
        env:
          SOURCE_TOKEN: ${{ secrets.ATLAS_NEWS_RECOVERY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "Falta el secret ATLAS_NEWS_RECOVERY_TOKEN de solo lectura." >&2
            exit 1
          fi

      - name: Checkout fuente privada en SHA exacto
        uses: actions/checkout@v5
        with:
          repository: EldeSiempre100/ATLAS_NEWS
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.ATLAS_NEWS_RECOVERY_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Confirmar SHA fuente
        working-directory: source
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$ATLAS_SOURCE_SHA"
          echo "Fuente fijada en $actual"

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Instalar dependencias canónicas
        working-directory: source
        run: npm ci

      - name: Actualizar indicadores con el código canónico
        working-directory: source
        run: npm run update:indicators

      - name: Build Astro canónico
        working-directory: source
        run: npm run build:site

      - name: Auditoría de producción canónica
        working-directory: source
        env:
          ATLAS_PUBLIC_DIR: dist
        run: npm run audit:production

      - name: Verificar status.json del build
        working-directory: source
        run: |
          set -euo pipefail
          test -f dist/status.json
          jq -e --arg sha "$ATLAS_SOURCE_SHA" '.schemaVersion == 1 and .sourceCommit == $sha' dist/status.json >/dev/null
          echo "status.json válido para $ATLAS_SOURCE_SHA"

      - name: Cerrar validación sin despliegue
        if: steps.request.outputs.mode == 'validate'
        run: echo "VALIDATION_SUCCESS $ATLAS_SOURCE_SHA"

      - name: Sincronizar dist preservando activos persistentes
        if: steps.request.outputs.mode == 'deploy_audio'
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='audio/' \
            --exclude='data/funds-beagf.json' \
            source/dist/ public/

          jq -e --arg sha "$ATLAS_SOURCE_SHA" '.sourceCommit == $sha' public/status.json >/dev/null

      - name: Commit y push web de emergencia
        id: web_publish
        if: steps.request.outputs.mode == 'deploy_audio'
        working-directory: public
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Emergency Runner"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Web pública ya coincide con el build de emergencia."
          else
            git commit -m "EMERGENCY: Publica ATLAS NEWS desde ${ATLAS_SOURCE_SHA}"
            git push origin main
          fi
          echo "public_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verificar commit web remoto
        if: steps.request.outputs.mode == 'deploy_audio'
        working-directory: public
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "${{ steps.web_publish.outputs.public_commit }}" origin/main
          git show origin/main:status.json | jq -e --arg sha "$ATLAS_SOURCE_SHA" '.sourceCommit == $sha' >/dev/null

      - name: Planificar Portada con scripts canónicos
        id: cover_plan
        if: steps.request.outputs.mode == 'deploy_audio'
        working-directory: source
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ github.workspace }}/public
          ATLAS_AUDIO_PLAN: ${{ runner.temp }}/atlas-cover-plan.json
          ATLAS_AUDIO_VOICE: ef_dora
          ATLAS_AUDIO_OWNER: audio-v2
        run: node scripts/prepare-daily-audio.mjs

      - name: Planificar Audio V2 con scripts canónicos
        id: audio_plan
        if: steps.request.outputs.mode == 'deploy_audio'
        working-directory: source
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ github.workspace }}/public
          ATLAS_COVER_PLAN: ${{ runner.temp }}/atlas-cover-plan.json
          ATLAS_AUDIO_V2_PLAN: ${{ runner.temp }}/atlas-audio-v2-plan.json
          ATLAS_AUDIO_V2_SIMULATE_MARKETS_FAILURE: "false"
        run: node scripts/prepare-audio-v2.mjs

      - name: Restaurar caché Kokoro
        if: steps.request.outputs.mode == 'deploy_audio' && steps.audio_plan.outputs.needs_generation == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1-${{ runner.os }}

      - name: Preparar Kokoro
        if: steps.request.outputs.mode == 'deploy_audio' && steps.audio_plan.outputs.needs_generation == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/kokoro-emergency-venv"
          source "$RUNNER_TEMP/kokoro-emergency-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy

      - name: Generar audio con scripts canónicos
        if: steps.request.outputs.mode == 'deploy_audio' && steps.audio_plan.outputs.needs_generation == 'true'
        working-directory: source
        env:
          ATLAS_PUBLIC_REPO_DIR: ${{ github.workspace }}/public
          ATLAS_AUDIO_V2_PLAN: ${{ runner.temp }}/atlas-audio-v2-plan.json
          ATLAS_AUDIO_SPEED: "1.0"
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/kokoro-emergency-venv/bin/activate"
          python scripts/generate-audio-v2.py

      - name: Publicar audio de emergencia
        id: audio_publish
        if: steps.request.outputs.mode == 'deploy_audio' && steps.audio_plan.outputs.needs_generation == 'true'
        working-directory: public
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Emergency Runner"
          git config user.email "actions@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "Audio ya vigente; no se crea commit."
          else
            git commit -m "EMERGENCY: Audio ATLAS NEWS desde ${ATLAS_SOURCE_SHA}"
            git push origin main
          fi
          echo "audio_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verificar manifiestos de audio
        if: steps.request.outputs.mode == 'deploy_audio'
        working-directory: public
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if git cat-file -e origin/main:audio/latest.json 2>/dev/null; then
            git show origin/main:audio/latest.json | jq -e --arg sha "$ATLAS_SOURCE_SHA" '.sourceCommit == $sha and .status == "published"' >/dev/null
          else
            echo "audio/latest.json ausente" >&2
            exit 1
          fi
          if git cat-file -e origin/main:audio/analysis-latest.json 2>/dev/null; then
            git show origin/main:audio/analysis-latest.json | jq -e --arg sha "$ATLAS_SOURCE_SHA" '.sourceCommit == $sha' >/dev/null
          else
            echo "audio/analysis-latest.json ausente" >&2
            exit 1
          fi

      - name: Resultado de emergencia
        run: |
          echo "EMERGENCY_SUCCESS mode=${{ steps.request.outputs.mode }} source_sha=$ATLAS_SOURCE_SHA"
