name: ATLAS NEWS — Emergency Audio Synthesis

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-audio-request-v2.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-public-audio-write
  cancel-in-progress: false

jobs:
  synthesize-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-audio-request-v2.json
          source_sha="$(jq -r '.source_sha' "$req")"
          date="$(jq -r '.date' "$req")"
          bundle_base="$(jq -r '.bundle_base_url' "$req" | sed 's:/*$::')"
          generator_blob_sha="$(jq -r '.generator_blob_sha' "$req")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$bundle_base" =~ ^https:// ]]
          [[ "$generator_blob_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "bundle_base=$bundle_base" >> "$GITHUB_OUTPUT"
          echo "generator_blob_sha=$generator_blob_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether audio is already current
        id: current
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
        run: |
          set -euo pipefail
          current=false
          if [[ -f audio/latest.json && -f audio/analysis-latest.json ]]; then
            if jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .status == "published"' audio/latest.json >/dev/null 2>&1 \
              && jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .national.status == "published" and .markets.status == "published"' audio/analysis-latest.json >/dev/null 2>&1; then
              current=true
            fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.12
        if: steps.current.outputs.current != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio dependencies
        if: steps.current.outputs.current != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Install canonical Kokoro dependencies
        if: steps.current.outputs.current != 'true'
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "kokoro==0.9.4" soundfile numpy

      - name: Download SHA-pinned canonical audio bundle
        if: steps.current.outputs.current != 'true'
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          BUNDLE_BASE: ${{ steps.request.outputs.bundle_base }}
          GENERATOR_BLOB_SHA: ${{ steps.request.outputs.generator_blob_sha }}
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors -fsSL "$BUNDLE_BASE/source-sha.txt" -o /tmp/source-sha.txt
          curl --retry 5 --retry-all-errors -fsSL "$BUNDLE_BASE/atlas-cover-plan.json" -o /tmp/atlas-cover-plan.json
          curl --retry 5 --retry-all-errors -fsSL "$BUNDLE_BASE/atlas-audio-v2-plan.json" -o /tmp/atlas-audio-v2-plan.json
          curl --retry 5 --retry-all-errors -fsSL "$BUNDLE_BASE/generate-audio-v2.py" -o /tmp/generate-audio-v2.py
          test "$(tr -d '\r\n' < /tmp/source-sha.txt)" = "$SOURCE_SHA"
          test "$(git hash-object /tmp/generate-audio-v2.py)" = "$GENERATOR_BLOB_SHA"
          jq -e --arg date "$DATE" '.date == $date and .needsGeneration == true' /tmp/atlas-audio-v2-plan.json >/dev/null

      - name: Synthesize Portada + Nacional + Mercados
        if: steps.current.outputs.current != 'true'
        env:
          ATLAS_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          ATLAS_AUDIO_V2_PLAN: /tmp/atlas-audio-v2-plan.json
          ATLAS_PUBLIC_REPO_DIR: ${{ github.workspace }}
          ATLAS_AUDIO_SPEED: "1.0"
        run: |
          set -euo pipefail
          python /tmp/generate-audio-v2.py

      - name: Verify generated audio contract
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
        run: |
          set -euo pipefail
          jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .status == "published" and .path == ("/audio/" + $date + "-resumen-diario.mp3")' audio/latest.json >/dev/null
          jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .national.status == "published" and .markets.status == "published" and .national.path == ("/audio/" + $date + "-national-analysis.mp3") and .markets.path == ("/audio/" + $date + "-markets-analysis.mp3")' audio/analysis-latest.json >/dev/null
          test -s "audio/$DATE-resumen-diario.mp3"
          test -s "audio/$DATE-national-analysis.mp3"
          test -s "audio/$DATE-markets-analysis.mp3"

      - name: Publish audio atomically to public repo
        if: steps.current.outputs.current != 'true'
        env:
          DATE: ${{ steps.request.outputs.date }}
        run: |
          set -euo pipefail
          git config user.name "ATLAS NEWS Emergency Audio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audio/latest.json \
            audio/analysis-latest.json \
            "audio/$DATE-resumen-diario.mp3" \
            "audio/$DATE-national-analysis.mp3" \
            "audio/$DATE-markets-analysis.mp3"
          if git diff --cached --quiet; then
            echo "No hay cambios de audio por publicar."
          else
            git commit -m "EMERGENCY: Audio ATLAS NEWS — $DATE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify committed manifests
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git show origin/main:audio/latest.json | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .status == "published"' >/dev/null
          git show origin/main:audio/analysis-latest.json | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .national.status == "published" and .markets.status == "published"' >/dev/null
          echo "EMERGENCY_AUDIO_SUCCESS source_sha=$SOURCE_SHA date=$DATE current=${{ steps.current.outputs.current }}"
