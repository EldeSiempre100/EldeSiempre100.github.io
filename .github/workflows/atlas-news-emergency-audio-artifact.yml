name: ATLAS NEWS — Emergency Audio Artifact Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/atlas-news-emergency-audio-request.json"

permissions:
  contents: write

concurrency:
  group: atlas-news-emergency-audio-artifact
  cancel-in-progress: false

jobs:
  deploy-audio:
    name: Publicar Audio V2 canónico de emergencia
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio público
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolver solicitud
        id: request
        shell: bash
        run: |
          set -euo pipefail
          req=.github/atlas-news-emergency-audio-request.json
          source_sha="$(jq -r '.source_sha' "$req")"
          base_url="$(jq -r '.artifact_base_url' "$req" | sed 's:/*$::')"
          date="$(jq -r '.date' "$req")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_url" =~ ^https:// ]]
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Descargar y validar manifiestos
        id: manifest
        env:
          BASE_URL: ${{ steps.request.outputs.base_url }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/atlas-news-emergency-audio"
          mkdir -p "$stage"
          curl --retry 5 --retry-all-errors -fsSL "$BASE_URL/audio/latest.json" -o "$stage/latest.json"
          curl --retry 5 --retry-all-errors -fsSL "$BASE_URL/audio/analysis-latest.json" -o "$stage/analysis-latest.json"

          jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '
            .sourceCommit == $sha and .date == $date and .status == "published"
          ' "$stage/latest.json" >/dev/null
          jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '
            .sourceCommit == $sha and .date == $date and
            .national.status == "published" and
            .markets.status == "published"
          ' "$stage/analysis-latest.json" >/dev/null

          cover_path="$(jq -r '.path' "$stage/latest.json")"
          national_path="$(jq -r '.national.path' "$stage/analysis-latest.json")"
          markets_path="$(jq -r '.markets.path' "$stage/analysis-latest.json")"
          for path in "$cover_path" "$national_path" "$markets_path"; do
            [[ "$path" =~ ^/audio/[A-Za-z0-9._-]+\.mp3$ ]]
          done
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "cover_path=$cover_path" >> "$GITHUB_OUTPUT"
          echo "national_path=$national_path" >> "$GITHUB_OUTPUT"
          echo "markets_path=$markets_path" >> "$GITHUB_OUTPUT"

      - name: Descargar MP3 canónicos
        env:
          BASE_URL: ${{ steps.request.outputs.base_url }}
          STAGE: ${{ steps.manifest.outputs.stage }}
          COVER_PATH: ${{ steps.manifest.outputs.cover_path }}
          NATIONAL_PATH: ${{ steps.manifest.outputs.national_path }}
          MARKETS_PATH: ${{ steps.manifest.outputs.markets_path }}
        run: |
          set -euo pipefail
          for path in "$COVER_PATH" "$NATIONAL_PATH" "$MARKETS_PATH"; do
            file="$(basename "$path")"
            curl --retry 5 --retry-all-errors -fsSL "$BASE_URL$path" -o "$STAGE/$file"
            test "$(stat -c%s "$STAGE/$file")" -gt 10000
          done

      - name: Publicar audio en un único commit
        id: publish
        env:
          STAGE: ${{ steps.manifest.outputs.stage }}
          COVER_PATH: ${{ steps.manifest.outputs.cover_path }}
          NATIONAL_PATH: ${{ steps.manifest.outputs.national_path }}
          MARKETS_PATH: ${{ steps.manifest.outputs.markets_path }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p audio
          install -m 644 "$STAGE/latest.json" audio/latest.json
          install -m 644 "$STAGE/analysis-latest.json" audio/analysis-latest.json
          install -m 644 "$STAGE/$(basename "$COVER_PATH")" "${COVER_PATH#/}"
          install -m 644 "$STAGE/$(basename "$NATIONAL_PATH")" "${NATIONAL_PATH#/}"
          install -m 644 "$STAGE/$(basename "$MARKETS_PATH")" "${MARKETS_PATH#/}"

          git config user.name "ATLAS NEWS Emergency Runner"
          git config user.email "actions@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "Los audios ya coinciden con el artefacto canónico."
          else
            git commit -m "EMERGENCY: Audio ATLAS NEWS — ${DATE} desde ${SOURCE_SHA}"
            git push origin main
          fi
          echo "audio_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verificar remoto y manifiestos
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          DATE: ${{ steps.request.outputs.date }}
          AUDIO_COMMIT: ${{ steps.publish.outputs.audio_commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$AUDIO_COMMIT" origin/main
          git show origin/main:audio/latest.json | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .status == "published"' >/dev/null
          git show origin/main:audio/analysis-latest.json | jq -e --arg sha "$SOURCE_SHA" --arg date "$DATE" '.sourceCommit == $sha and .date == $date and .national.status == "published" and .markets.status == "published"' >/dev/null
          echo "EMERGENCY_AUDIO_SUCCESS source_sha=$SOURCE_SHA date=$DATE"
