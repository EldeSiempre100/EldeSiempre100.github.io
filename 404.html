<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,follow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="refresh" content="0;url=https://atlasnews-media.github.io/" />
    <title>ATLAS NEWS — Redirección</title>
    <script>
      (() => {
        const destination =
          "https://atlasnews-media.github.io" +
          window.location.pathname +
          window.location.search +
          window.location.hash;
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>
      ATLAS NEWS cambió de dirección.
      <a href="https://atlasnews-media.github.io/">Continuar al sitio institucional</a>.
    </p>
  </body>
</html>
